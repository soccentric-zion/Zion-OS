header:
  version: 14
  includes:
    # Repo-root-relative paths (kas resolves string includes against the git
    # repo root first; file-relative fallbacks emit kas warnings).
    - kas/repos/poky.yaml
    - kas/repos/meta-arm.yaml
    - kas/repos/meta-openembedded.yaml
    - kas/repos/meta-virtualization.yaml
    - kas/repos/meta-xilinx.yaml
    - kas/repos/meta-xilinx-tools.yaml
    - kas/repos/meta-kria.yaml
    - kas/repos/meta-openamp.yaml
    - kas/repos/meta-swupdate.yaml
    - kas/repos/meta-zion.yaml

distro: poky
target: zion-image

local_conf_header:
  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # OpenAMP / remoteproc for RPU (Cortex-R5) firmware lifecycle management
    DISTRO_FEATURES:append = " openamp"

    # Accept the commercial license for the VCU OpenMAX (gstreamer1.0-omx)
    # plugin and the faad2/faac codecs required by gstreamer1.0-plugins-bad
    # (enabled by meta-xilinx-multimedia for the KV260 VCU).
    LICENSE_FLAGS_ACCEPTED:append = " commercial_gstreamer1.0-omx commercial_faad2 commercial_faac"

    # Storage image output types
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

    # SWUpdate: enable built-in Mongoose web server and progress IPC
    PACKAGECONFIG:append:pn-swupdate = " webserver"

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # boot.scr for Kria/SDT machines is generated by u-boot-xlnx-scr (via
    # meta-kria's kria-boot-cmd.inc); UBOOT_ENV must not be set globally or
    # u-boot-xlnx:do_compile tries to compile a boot.cmd that doesn't exist.
    EXTRA_IMAGEDEPENDS += "virtual/bootloader"
    IMAGE_INSTALL:append = " libubootenv-bin"

    # SWUpdate init integration
    SWUPDATE_INIT = "systemd"

    # Accept the restricted 'commercial' license for the gstreamer stack that
    # packagegroup-xilinx-gstreamer (added for the KV260 Vision AI stack) pulls
    # in (gstreamer1.0-omx, faac via gstreamer1.0-plugins-bad, etc.). Without
    # this the image build fails with "Nothing RPROVIDES/PROVIDES ...
    # restricted license 'commercial' not listed in LICENSE_FLAGS_ACCEPTED".
    LICENSE_FLAGS_ACCEPTED:append = " commercial"

    # Allow source-acquisition tasks to run during the extensible SDK's
    # sstate-enforcement check (oe-check-sstate). The ZynqMP baremetal
    # multiconfigs (fsbl / cortex-r5 / microblaze-pmu) build firmware recipes
    # (embeddedsw-source, newlib, libgloss, embeddedsw drivers) whose
    # do_fetch/do_unpack/do_patch fetch git sources into work-shared and have
    # no setscene sstate. Without this, each one aborts the esdk build with
    # "Task <recipe>.do_fetch attempted to execute unexpectedly".
    #
    # These are source-acquisition tasks, not build tasks: the sstate that the
    # eSDK verification really cares about (do_compile/do_package/do_populate_
    # sysroot) is still enforced. Allowing fetch/unpack/patch just permits
    # (re)acquiring sources from DL_DIR/network during the check.
    #
    # Must use :append here: populate_sdk_ext.bbclass writes its own hard '='
    # assignment to BB_SETSCENE_ENFORCE_IGNORE_TASKS into the SDK's local.conf
    # after this one, and a plain '=' would be clobbered (last-one-wins). With
    # :append our patterns are appended onto the SDK's default value instead.
    BB_SETSCENE_ENFORCE_IGNORE_TASKS:append = " *:do_fetch *:do_unpack *:do_patch"

    # QEMU ZynqMP emulation (kria-qemu-kv.inc / runqemu) needs the proprietary
    # PMU ROM (pmu-rom-native, fetched from xilinx.com). Accepting the
    # 'xilinx' license flag enables it and silences the "ZynqMP pmu-rom is
    # not enabled" warning emitted by meta-xilinx-core's xilinx-vars class.
    LICENSE_FLAGS_ACCEPTED:append = " xilinx"

    # meta-xilinx-tools' sanity check only recognizes the legacy XSCT
    # workflow (XILINX_WITH_ESW == "xsct"); our SDT-based Kria machines set
    # XILINX_WITH_ESW = "sdt", so the check produces a false positive
    # ("layer included but not enabled"). Opt out via the documented skip
    # variable — meta-xilinx-tools itself (bootgen, xilinx-bootbin) works.
    SKIP_META_XILINX_TOOLS_SANITY_CHECK = "1"

    # meta-virtualization is included only because meta-xilinx-standalone-sdt
    # depends on its BBFILE collection (virtualization-layer). Containers are
    # not used in this image, so 'virtualization' stays out of
    # DISTRO_FEATURES; opt out of the layer's bbappend warning via the
    # documented skip variable.
    SKIP_META_VIRT_SANITY_CHECK = "1"
