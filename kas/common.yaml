header:
  version: 14
  includes:
    - repos/poky.yaml
    - repos/meta-arm.yaml
    - repos/meta-openembedded.yaml
    - repos/meta-virtualization.yaml
    - repos/meta-xilinx.yaml
    - repos/meta-xilinx-tools.yaml
    - repos/meta-kria.yaml
    - repos/meta-openamp.yaml
    - repos/meta-swupdate.yaml
    - repos/meta-zion.yaml

distro: poky
target: zion-image

local_conf_header:
  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # OpenAMP / remoteproc for RPU (Cortex-R5) firmware lifecycle management
    DISTRO_FEATURES:append = " openamp"

    # Accept the commercial license for the VCU OpenMAX (gstreamer1.0-omx)
    # plugin and the faad2/faac codecs required by gstreamer1.0-plugins-bad
    # (enabled by meta-xilinx-multimedia for the KV260 VCU).
    LICENSE_FLAGS_ACCEPTED:append = " commercial_gstreamer1.0-omx commercial_faad2 commercial_faac"

    # Storage image output types
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

    # SWUpdate: enable built-in Mongoose web server and progress IPC
    PACKAGECONFIG:append:pn-swupdate = " webserver"

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # boot.scr for Kria/SDT machines is generated by u-boot-xlnx-scr (via
    # meta-kria's kria-boot-cmd.inc); UBOOT_ENV must not be set globally or
    # u-boot-xlnx:do_compile tries to compile a boot.cmd that doesn't exist.
    EXTRA_IMAGEDEPENDS += "virtual/bootloader"
    IMAGE_INSTALL:append = " libubootenv-bin"

    # SWUpdate init integration
    SWUPDATE_INIT = "systemd"

    # Accept the restricted 'commercial' license for the gstreamer stack that
    # packagegroup-xilinx-gstreamer (added for the KV260 Vision AI stack) pulls
    # in (gstreamer1.0-omx, faac via gstreamer1.0-plugins-bad, etc.). Without
    # this the image build fails with "Nothing RPROVIDES/PROVIDES ...
    # restricted license 'commercial' not listed in LICENSE_FLAGS_ACCEPTED".
    LICENSE_FLAGS_ACCEPTED:append = " commercial"

    # Allow the Xilinx embeddedsw-source fetch to run during the extensible
    # SDK's sstate-enforcement check (oe-check-sstate). This recipe fetches the
    # multi-GB Xilinx embeddedsw git repo into work-shared and its do_fetch has
    # no setscene sstate, so without this it aborts the esdk build with
    # "Task embeddedsw-source-*.do_fetch attempted to execute unexpectedly".
    #
    # Must use :append here: populate_sdk_ext.bbclass writes its own hard '='
    # assignment to BB_SETSCENE_ENFORCE_IGNORE_TASKS into the SDK's local.conf
    # after this one, and a plain '=' would be clobbered (last-one-wins). With
    # :append our pattern is appended onto the SDK's default value instead.
    BB_SETSCENE_ENFORCE_IGNORE_TASKS:append = " embeddedsw-source*:do_fetch"
